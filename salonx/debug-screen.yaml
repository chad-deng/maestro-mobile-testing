appId: com.storehub.salonx.staff.dev
---
# Debug test to capture login screen elements
- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Wait for screen to load
- waitForAnimationToEnd

# Take screenshot to see what's on screen
- takeScreenshot: login-screen-debug.png

# Try to find various possible "Forgot Password" text variations
- runFlow:
    when:
      visible: "Forgot Password"
    commands:
      - tapOn: "Forgot Password"
      - takeScreenshot: found-forgot-password.png

- runFlow:
    when:
      visible: "Forgot password"
    commands:
      - tapOn: "Forgot password"
      - takeScreenshot: found-forgot-password-lowercase.png

- runFlow:
    when:
      visible: "forgot password"
    commands:
      - tapOn: "forgot password"
      - takeScreenshot: found-forgot-password-all-lowercase.png

- runFlow:
    when:
      visible: "Forgot.*"
    commands:
      - tapOn:
          text: "Forgot.*"
      - takeScreenshot: found-forgot-regex.png

# Check if there's a link or button near the bottom
- runFlow:
    when:
      visible: ".*password.*"
    commands:
      - takeScreenshot: found-password-text.png

