appId: com.storehub.salonx.staff.dev
tags:
  - bug
  - localization
  - password
  - validation
  - P1
  - regression
---
# BUG-003: Raw technical validation keys displayed on Password Change screen
# Bug ID: rec3VgMdyn
# Platform: iOS
#
# Description: Validation errors show raw keys like "validation.password.currentRequired"
#              instead of localized Japanese messages
#
# Steps to Reproduce:
# 1. Navigate to the Password Change (パスワード変更) screen
# 2. Leave all fields blank and click the Save (保存) button
# 3. Observe the red error text appearing under each input field
#
# Expected: Localized Japanese error messages like:
#   - 「現在のパスワードを入力してください」
#   - 「新しいパスワードは8文字以上で入力してください」
#   - 「新しいパスワード（確認用）を入力してください」
# Actual (Bug): Raw strings like "validation.password.currentRequired"

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

- waitForAnimationToEnd

# Finish any leftover store picker before resetting to login
- runFlow:
    when:
      visible: "Switch Store|店舗.*|auto_test"
    commands:
      - tapOn:
          text: "auto_test"
          index: 0
      - tapOn: "Confirm|確認"
      - waitForAnimationToEnd

# Reset to login if a previous test left the app signed in
- runFlow:
    when:
      visible: "Profile|プロフィール|個人"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd
      - tapOn: "Sign Out|ログアウト"

- runFlow:
    when:
      visible: "Confirm|確認"
    commands:
      - tapOn: "Confirm|確認"

- runFlow:
    when:
      visible: "Yes|はい"
    commands:
      - tapOn: "Yes|はい"

- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

- waitForAnimationToEnd

# Login with stable selectors
- assertVisible: ".*@.*|Enter your email|.*メール.*"
- assertVisible: "•+|Enter your password|.*password.*|.*パスワード.*"
- tapOn: ".*@.*|Enter your email|.*メール.*"
- eraseText
- tapOn: ".*@.*|Enter your email|.*メール.*"
- eraseText
- inputText: "chad.deng+123@storehub.com"
- tapOn: "•+|Enter your password|.*password.*|.*パスワード.*"
- eraseText
- tapOn: "•+|Enter your password|.*password.*|.*パスワード.*"
- eraseText
- inputText: 12345678
- tapOn:
    text: "Sign In|サインイン"
    index: 1

- waitForAnimationToEnd

- runFlow:
    when:
      visible: "Switch Store|店舗.*|auto_test|Confirm|確認"
    commands:
      - tapOn:
          text: "auto_test"
          index: 0
      - tapOn: "Confirm|確認"
      - waitForAnimationToEnd

- waitForAnimationToEnd

- assertVisible: "Dashboard|Appointments|Customers|Profile|ダッシュボード|予約|顧客|個人"

# Navigate to Profile tab (English)
- runFlow:
    when:
      visible: "Profile"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd

# Navigate to Profile tab (Japanese)
- runFlow:
    when:
      visible: "個人"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd

- waitForAnimationToEnd

# Step 1: Navigate to Password Change screen
# First, tap on Account Settings in the Preferences section
- tapOn:
    text: "Account Settings|アカウント設定"

- waitForAnimationToEnd

# Now tap on Change Password option
- tapOn:
    text: "Change Password|パスワード変更"

- waitForAnimationToEnd

# Step 2: Leave all fields blank and tap Save
- runFlow:
    when:
      visible: "Save|保存"
    commands:
      - tapOn:
          text: "Save|保存"

- waitForAnimationToEnd

# Step 3: Verify NO raw validation keys are displayed
# Bug check: Raw technical keys should NOT be visible
- assertNotVisible:
    text: "validation\\."
- assertNotVisible:
    text: "validation.password"
- assertNotVisible:
    text: "validation.password.currentRequired"
- assertNotVisible:
    text: "validation.password.newRequired"
- assertNotVisible:
    text: "validation.password.confirmRequired"

# Expected: Proper localized error messages should appear
# Check for Japanese error messages or English equivalents
- runFlow:
    when:
      visible: ".*[Rr]equired.*|.*入力.*|.*必須.*"
    commands:
      - assertVisible: ".*[Rr]equired.*|.*入力.*|.*必須.*"
