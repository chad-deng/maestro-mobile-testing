appId: com.storehub.salonx.staff
tags:
  - bug
  - localization
  - password
  - validation
  - P1
  - regression
---
# BUG-003: Raw technical validation keys displayed on Password Change screen
# Bug ID: rec3VgMdyn
# Platform: iOS
#
# Description: Validation errors show raw keys like "validation.password.currentRequired"
#              instead of localized Japanese messages
#
# Steps to Reproduce:
# 1. Navigate to the Password Change (パスワード変更) screen
# 2. Leave all fields blank and click the Save (保存) button
# 3. Observe the red error text appearing under each input field
#
# Expected: Localized Japanese error messages like:
#   - 「現在のパスワードを入力してください」
#   - 「新しいパスワードは8文字以上で入力してください」
#   - 「新しいパスワード（確認用）を入力してください」
# Actual (Bug): Raw strings like "validation.password.currentRequired"

- launchApp:
    appId: "com.storehub.salonx.staff"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

- waitForAnimationToEnd

# Check if already logged in, if not, perform login
- runFlow:
    when:
      visible: "Enter your email"
    commands:
      - tapOn: "Enter your email"
      - eraseText
      - inputText: "chad.deng+123@storehub.com"
      - tapOn: "Enter your password"
      - eraseText
      - inputText: 12345678
      - tapOn:
          text: "Sign In"
          index: 1
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "auto_test"
          commands:
            - tapOn:
                text: "auto_test"
                index: 0
            - tapOn: "Confirm"

- waitForAnimationToEnd

# Navigate to Profile tab (English)
- runFlow:
    when:
      visible: "Profile"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd

# Navigate to Profile tab (Japanese)
- runFlow:
    when:
      visible: "個人"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd

- waitForAnimationToEnd

# Step 1: Navigate to Password Change screen
- scrollUntilVisible:
    element:
      text: ".*[Pp]assword.*|.*パスワード.*"
    direction: "DOWN"

# Try tapping on Settings if it exists
- runFlow:
    when:
      visible: ".*[Ss]etting.*|.*設定.*"
    commands:
      - tapOn:
          text: ".*[Ss]etting.*|.*設定.*"
      - waitForAnimationToEnd

# Look for and tap Change Password option
- scrollUntilVisible:
    element:
      text: ".*[Cc]hange.*[Pp]assword.*|.*パスワード変更.*"
    direction: "DOWN"

- tapOn:
    text: ".*[Cc]hange.*[Pp]assword.*|.*パスワード変更.*"

- waitForAnimationToEnd

# Step 2: Leave all fields blank and tap Save
- runFlow:
    when:
      visible: "Save|保存"
    commands:
      - tapOn:
          text: "Save|保存"

- waitForAnimationToEnd

# Step 3: Verify NO raw validation keys are displayed
# Bug check: Raw technical keys should NOT be visible
- assertNotVisible:
    text: "validation\\."
- assertNotVisible:
    text: "validation.password"
- assertNotVisible:
    text: "validation.password.currentRequired"
- assertNotVisible:
    text: "validation.password.newRequired"
- assertNotVisible:
    text: "validation.password.confirmRequired"

# Expected: Proper localized error messages should appear
# Check for Japanese error messages or English equivalents
- runFlow:
    when:
      visible: ".*[Rr]equired.*|.*入力.*|.*必須.*"
    commands:
      - assertVisible: ".*[Rr]equired.*|.*入力.*|.*必須.*"
