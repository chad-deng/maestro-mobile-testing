appId: com.storehub.salonx.staff.dev
tags:
  - bug
  - crash
  - android
  - P0
  - regression
---
# BUG-006: App crashes with "IllegalStateException" when switching business entities
# Bug ID: reccpDVQQI
# Platform: Android
#
# Description: App crashes with UIFramework exception when switching between stores/businesses
#
# Error: "addViewAt: failed to insert view [2236] into parent [2318] at index 0.
#         The specified child already has a parent. You must call removeView()
#         on the child's parent first."
#
# Steps to Reproduce:
# 1. Open Salon X Staff Dev App and login
# 2. Go to settings or profile page, tap "Sign out" (or Switch Business)
# 3. In the "事業切換" list, select a different store
# 4. Tap the 確認 (Confirm) button in the top right
# 5. Observe the crash
#
# Expected: App should smoothly switch to selected store and load home interface
# Actual (Bug): System throws Exception and shows red screen with stack trace

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

- waitForAnimationToEnd

# Wait for app state to stabilize before handling login/logout below
- waitForAnimationToEnd

# Step 2: Reset to login screen if we're already logged in
# Current builds no longer expose a dedicated in-profile Switch Business row,
# so we exercise the same business-selection modal via the sign-in flow.
- runFlow:
    when:
      visible: "Profile|プロフィール|個人"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd
      - tapOn: "Sign Out|ログアウト"

- runFlow:
    when:
      visible: "Confirm|確認"
    commands:
      - tapOn: "Confirm|確認"

- runFlow:
    when:
      visible: "Yes|はい"
    commands:
      - tapOn: "Yes|はい"

- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

- waitForAnimationToEnd

# Step 3: Login and open the business/store selection modal
- assertVisible: "Sign In|サインイン"
- tapOn: "Enter your email"
- eraseText
- tapOn: "Enter your email"
- eraseText
- inputText: "chad.deng+123@storehub.com"
- assertVisible: 'chad.deng\+123@storehub\.com'

- tapOn: "Enter your password"
- eraseText
- tapOn: "Enter your password"
- eraseText
- inputText: 12345678

- tapOn:
    text: "Sign In|サインイン"
    index: 1

- waitForAnimationToEnd

# Step 4: Select a different store from the business list
- assertVisible: "auto_test"
- tapOn:
    text: "auto_test"
    index: 0

# Step 5: Tap Confirm button
- tapOn: "Confirm|確認"

- waitForAnimationToEnd:
    timeout: 10000

# Bug verification: App should NOT crash
# Check that we're still in the app and not on error screen
- assertNotVisible:
    text: ".*Exception.*"
- assertNotVisible:
    text: ".*IllegalStateException.*"
- assertNotVisible:
    text: ".*UIFramework.*"
- assertNotVisible:
    text: ".*addViewAt.*failed.*"
- assertNotVisible:
    text: ".*removeView.*"

# Verify app is functional - home screen elements should be visible
- runFlow:
    when:
      visible: "Home|ホーム|Dashboard|ダッシュボード|Profile|プロフィール|個人"
    commands:
      - assertVisible: "Home|ホーム|Dashboard|ダッシュボード|Profile|プロフィール|個人"

# Additional check: Verify we can navigate (app is not frozen)
- tapOn:
    text: "Home|ホーム|Dashboard|ダッシュボード"
    optional: true

- waitForAnimationToEnd
