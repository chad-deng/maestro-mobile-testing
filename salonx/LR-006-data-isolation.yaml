appId: com.storehub.salonx.staff.dev
tags:
  - leave-request
  - data-isolation
  - security
  - P0
---
# LR-006: [隔离] 切换至其他门店（Tenant）账号
# Description: Switch to another store/tenant account
# Expected: Cannot view current employee's leave history (data isolation)
# Risk Dimension: 数据隔离 (Data Isolation)

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

# Wait for app to load
- waitForAnimationToEnd

# Step 1: Login as User A (owner@demo.com) and create a leave request
- runFlow:
    when:
      visible: "Enter your email"
    commands:
      # Login flow
      - tapOn: "Enter your email"
      - eraseText
      - inputText: "owner@demo.com"
      - tapOn: "Enter your password"
      - eraseText
      - inputText: password123
      - tapOn:
          text: "Sign In"
          index: 1
      - waitForAnimationToEnd
      # Handle store selection - select Store A
      - runFlow:
          when:
            visible: "Salon.*"
          commands:
            - tapOn:
                text: "Salon.*"
                index: 0
            - tapOn: "Confirm"
            - waitForAnimationToEnd

# Navigate to Leave Request section
- runFlow:
    when:
      visible: "Profile"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "個人"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd

# Look for Leave Request / Time Off option
- scrollUntilVisible:
    element:
      text: ".*[Ll]eave.*|.*[Tt]ime [Oo]ff.*|.*休暇.*"
    direction: "DOWN"

- tapOn:
    text: ".*[Ll]eave.*|.*[Tt]ime [Oo]ff.*|.*休暇.*"

- waitForAnimationToEnd

# Take screenshot of User A's leave requests
- takeScreenshot: user-a-leave-requests.png

# Verify User A has leave requests visible
- runFlow:
    when:
      visible: ".*[Pp]ending.*|.*[Aa]pproved.*|.*[Cc]ancelled.*"
    commands:
      - assertVisible:
          text: ".*[Pp]ending.*|.*[Aa]pproved.*|.*[Cc]ancelled.*"

# Step 2: Logout from User A
- tapOn:
    point: "10%,5%"

- waitForAnimationToEnd

# Navigate to Profile to logout
- runFlow:
    when:
      visible: "Profile"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "個人"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd

# Scroll to find Sign Out
- scrollUntilVisible:
    element:
      text: ".*[Ss]ign [Oo]ut.*|.*ログアウト.*"
    direction: "DOWN"

- tapOn:
    text: ".*[Ss]ign [Oo]ut.*|.*ログアウト.*"

- waitForAnimationToEnd

# Handle confirmation if present
- runFlow:
    when:
      visible: ".*[Cc]onfirm.*|.*[Yy]es.*|.*OK.*"
    commands:
      - tapOn:
          text: ".*[Cc]onfirm.*|.*[Yy]es.*|.*OK.*"

- waitForAnimationToEnd

# Step 3: Login as User B (different tenant/store)
- tapOn: "Enter your email"
- eraseText
- inputText: "staff@demo.com"

- tapOn: "Enter your password"
- eraseText
- inputText: password123

- tapOn:
    text: "Sign In"
    index: 1

- waitForAnimationToEnd

# Handle store selection - select a DIFFERENT store (Store B)
- runFlow:
    when:
      visible: "Salon.*"
    commands:
      # Select a different store (index 1 instead of 0)
      - tapOn:
          text: "Salon.*"
          index: 1
      - tapOn: "Confirm"
      - waitForAnimationToEnd

# Navigate to Leave Request section as User B
- runFlow:
    when:
      visible: "Profile"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "個人"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd

# Look for Leave Request / Time Off option
- scrollUntilVisible:
    element:
      text: ".*[Ll]eave.*|.*[Tt]ime [Oo]ff.*|.*休暇.*"
    direction: "DOWN"

- tapOn:
    text: ".*[Ll]eave.*|.*[Tt]ime [Oo]ff.*|.*休暇.*"

- waitForAnimationToEnd

# Take screenshot of User B's leave requests
- takeScreenshot: user-b-leave-requests.png

# Verify User B CANNOT see User A's leave requests
# User B should either see:
# 1. Empty list / No records
# 2. Only their own leave requests (different from User A's)

# Verify data isolation - User A's data should NOT be visible
- assertNotVisible:
    text: "owner@demo.com"

# Success: Data isolation is working if User B cannot see User A's leave history

