- runFlow: REG-001-forgot-password.yaml

# REG-002: Login Flow
- runFlow: REG-002-login.yaml

# REG-003: Language Switch
- runFlow: REG-003-language-switch.yaml

# REG-004: Change Password
- runFlow: REG-004-change-password.yaml

# REG-005: Logout Flow
- runFlow: REG-005-logout.yaml

