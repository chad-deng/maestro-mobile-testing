# SalonX Regression Test Suite
# Combines all REG (Registration/Auth) and BUG (Bug Regression) tests
#
# Usage: maestro test salonx/REGRESSION-suite.yaml
#
# Total: 21 tests
# - REG: 5 tests (authentication, settings)
# - BUG: 7 tests (bug regression)
# - LR: 1 test (leave request)
# - ROLE: 2 tests (role-based permissions)
# - TEAM: 6 tests (team/staff management)

appId: com.storehub.salonx.staff.dev
---

# ============================================
# REG - Registration/Authentication Tests
# ============================================

