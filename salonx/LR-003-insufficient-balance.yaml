appId: com.storehub.salonx.staff.dev
tags:
  - leave-request
  - validation
  - boundary
  - P0
---
# LR-003: [异常] 请假天数超过可用余额
# Description: Submit a leave request with days exceeding available balance
# Expected: Submission fails, shows "Insufficient balance" error
# Risk Dimension: 核心指标 (Core Metrics)

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

# Wait for app to load
- waitForAnimationToEnd

# Check if already logged in, if not, perform login
- runFlow:
    when:
      visible: "Enter your email"
    commands:
      # Login flow
      - tapOn: "Enter your email"
      - eraseText
      - inputText: "chad.deng+123@storehub.com"
      - tapOn: "Enter your password"
      - eraseText
      - inputText: 12345678
      - tapOn:
          text: "Sign In"
          index: 1
      - waitForAnimationToEnd
      # Handle store selection if it appears
      - runFlow:
          when:
            visible: "auto_test"
          commands:
            - tapOn:
                text: "auto_test"
                index: 0
            - tapOn: "Confirm"
            - waitForAnimationToEnd

# Navigate to Profile or Menu to find Leave Request
- runFlow:
    when:
      visible: "Profile"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd

# Navigate to Profile (Japanese)
- runFlow:
    when:
      visible: "個人"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd

# Look for Leave Request / Time Off option
- scrollUntilVisible:
    element:
      text: ".*[Ll]eave.*|.*[Tt]ime [Oo]ff.*|.*休暇.*"
    direction: "DOWN"

- tapOn:
    text: ".*[Ll]eave.*|.*[Tt]ime [Oo]ff.*|.*休暇.*"

- waitForAnimationToEnd

# Capture current leave balance
- takeScreenshot: current-leave-balance.png

# Tap + button to create new request (SVG icon in top-right)
- tapOn:
    point: "92%,8%"

- waitForAnimationToEnd

# The form opens with pre-filled dates
# We need to modify the dates to request many days
# For now, let's try to submit with a very long reason to test validation
# Or we can try to change the end date to far future

# Tap on End Date to change it
- tapOn: "End Date"
- waitForAnimationToEnd

# Try to select a date far in the future by scrolling in calendar
- scroll
- scroll
- scroll
- waitForAnimationToEnd

# Tap on a date in the future (approximate location)
- tapOn:
    point: "80%,70%"

- waitForAnimationToEnd

# Add a reason
- tapOn: "Enter reason for leave (optional)"
- inputText: "Testing insufficient balance"

- waitForAnimationToEnd

# Try to submit the request
- tapOn: "Submit"

- waitForAnimationToEnd

# Verify error message appears
- assertVisible:
    text: ".*[Ii]nsufficient.*|.*[Nn]ot [Ee]nough.*|.*[Ee]xceed.*|.*余额不足.*|.*超出.*"

# Take screenshot of error
- takeScreenshot: insufficient-balance-error.png

# Verify submission is blocked
- runFlow:
    when:
      visible: ".*[Ee]rror.*|.*[Ff]ailed.*"
    commands:
      - assertVisible:
          text: ".*[Ee]rror.*|.*[Ff]ailed.*"

