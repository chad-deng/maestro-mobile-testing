appId: com.storehub.salonx.staff.dev
tags:
  - leave-request
  - sick-leave
  - P0
  - business-impact
---
# LR-001: [核心] 正常提交 Sick Leave 申请
# Description: Submit a normal sick leave request
# Expected: Status becomes Pending, new record appears in list, balance is deducted (pre-deducted)
# Risk Dimension: 业务影响 (Business Impact)

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

# Wait for app to load
- waitForAnimationToEnd

# Check if already logged in, if not, perform login
- runFlow:
    when:
      visible: "Enter your email"
    commands:
      # Login flow
      - tapOn: "Enter your email"
      - eraseText
      - inputText: "owner@demo.com"
      - tapOn: "Enter your password"
      - eraseText
      - inputText: password123
      - tapOn:
          text: "Sign In"
          index: 1
      - waitForAnimationToEnd
      # Handle store selection if it appears
      - runFlow:
          when:
            visible: "Salon.*"
          commands:
            - tapOn:
                text: "Salon.*"
                index: 0
            - tapOn: "Confirm"
            - waitForAnimationToEnd

# Navigate to Profile or Menu to find Leave Request
- runFlow:
    when:
      visible: "Profile"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd

# Navigate to Profile (Japanese)
- runFlow:
    when:
      visible: "個人"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd

# Look for Leave Request / Time Off option
- scrollUntilVisible:
    element:
      text: ".*[Ll]eave.*|.*[Tt]ime [Oo]ff.*|.*休暇.*"
    direction: "DOWN"

- tapOn:
    text: ".*[Ll]eave.*|.*[Tt]ime [Oo]ff.*|.*休暇.*"

- waitForAnimationToEnd

# Capture current leave balance before submission
- takeScreenshot: before-leave-balance.png

# Tap on "New Request" or "Submit Request" button
- runFlow:
    when:
      visible: ".*[Nn]ew.*[Rr]equest.*"
    commands:
      - tapOn:
          text: ".*[Nn]ew.*[Rr]equest.*"

- runFlow:
    when:
      visible: ".*[Ss]ubmit.*[Rr]equest.*"
    commands:
      - tapOn:
          text: ".*[Ss]ubmit.*[Rr]equest.*"

- runFlow:
    when:
      visible: "\\+"
    commands:
      - tapOn: "\\+"

- waitForAnimationToEnd

# Select Leave Type: Sick Leave
- runFlow:
    when:
      visible: ".*[Ll]eave.*[Tt]ype.*"
    commands:
      - tapOn:
          text: ".*[Ll]eave.*[Tt]ype.*"

- runFlow:
    when:
      visible: ".*[Ss]ick.*[Ll]eave.*"
    commands:
      - tapOn:
          text: ".*[Ss]ick.*[Ll]eave.*"

# Select Start Date (today)
- runFlow:
    when:
      visible: ".*[Ss]tart.*[Dd]ate.*"
    commands:
      - tapOn:
          text: ".*[Ss]tart.*[Dd]ate.*"
      - waitForAnimationToEnd
      # Select today's date (usually pre-selected)
      - tapOn: ".*[Cc]onfirm.*|.*OK.*"

# Select End Date (today or tomorrow)
- runFlow:
    when:
      visible: ".*[Ee]nd.*[Dd]ate.*"
    commands:
      - tapOn:
          text: ".*[Ee]nd.*[Dd]ate.*"
      - waitForAnimationToEnd
      - tapOn: ".*[Cc]onfirm.*|.*OK.*"

# Add reason/notes
- runFlow:
    when:
      visible: ".*[Rr]eason.*|.*[Nn]ote.*"
    commands:
      - tapOn:
          text: ".*[Rr]eason.*|.*[Nn]ote.*"
      - inputText: "Feeling unwell, need rest"

# Submit the request
- tapOn:
    text: ".*[Ss]ubmit.*"

- waitForAnimationToEnd

# Verify submission success
# 1. Status should be "Pending"
- assertVisible:
    text: ".*[Pp]ending.*"

# 2. New record should appear in the list
- takeScreenshot: after-submission-list.png

# 3. Verify balance is deducted (pre-deducted)
- takeScreenshot: after-leave-balance.png

# Verify the leave request details
- runFlow:
    when:
      visible: ".*[Ss]ick.*[Ll]eave.*"
    commands:
      - assertVisible:
          text: ".*[Ss]ick.*[Ll]eave.*"

# Success message or confirmation
- runFlow:
    when:
      visible: ".*[Ss]uccess.*|.*[Ss]ubmitted.*"
    commands:
      - assertVisible:
          text: ".*[Ss]uccess.*|.*[Ss]ubmitted.*"

