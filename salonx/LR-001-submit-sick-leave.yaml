appId: com.storehub.salonx.staff.dev
tags:
  - leave-request
  - sick-leave
  - P0
  - business-impact
---
# LR-001: [核心] 正常提交 Sick Leave 申请
# Description: Submit a normal sick leave request
# Expected: Status becomes Pending, new record appears in list, balance is deducted (pre-deducted)
# Risk Dimension: 业务影响 (Business Impact)

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

# Wait for app to load
- waitForAnimationToEnd

# Back out of leave-request subpages left by a prior flow
- runFlow:
    when:
      visible: "Request Leave|My Leaves|Pending Reviews|Leave Requests|休暇"
    commands:
      - back
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "My Leaves|Pending Reviews|Leave Requests|休暇"
          commands:
            - waitForAnimationToEnd
            - back

# Finish any leftover store picker before resetting to login
- runFlow:
    when:
      visible: "Switch Store|店舗.*|auto_test"
    commands:
      - tapOn:
          text: "auto_test"
          index: 0
      - tapOn: "Confirm|確認"
      - waitForAnimationToEnd

# Reset to login if a previous test left the app signed in
- runFlow:
    when:
      visible: "Profile|プロフィール|個人"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd
      - tapOn: "Sign Out|ログアウト"

- runFlow:
    when:
      visible: "Confirm|確認"
    commands:
      - tapOn: "Confirm|確認"

- runFlow:
    when:
      visible: "Yes|はい"
    commands:
      - tapOn: "Yes|はい"

- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

- waitForAnimationToEnd

# Login with stable selectors
- assertVisible: ".*@.*|Enter your email|.*メール.*"
- assertVisible: "•+|Enter your password|.*password.*|.*パスワード.*"
- tapOn: ".*@.*|Enter your email|.*メール.*"
- eraseText
- tapOn: ".*@.*|Enter your email|.*メール.*"
- eraseText
- inputText: "chad.deng+123@storehub.com"
- assertVisible: 'chad.deng\+123@storehub\.com'

- tapOn: "•+|Enter your password|.*password.*|.*パスワード.*"
- eraseText
- tapOn: "•+|Enter your password|.*password.*|.*パスワード.*"
- eraseText
- inputText: 12345678

- tapOn:
    text: "Sign In|サインイン"
    index: 1

- waitForAnimationToEnd

# Handle store selection if it appears
- runFlow:
    when:
      visible: "Switch Store|店舗.*|auto_test|Confirm|確認"
    commands:
      - tapOn:
          text: "auto_test"
          index: 0
      - tapOn: "Confirm|確認"
      - waitForAnimationToEnd

- assertVisible: "Dashboard|Appointments|Customers|Profile|ダッシュボード|予約|顧客|個人"

# Navigate to Profile tab (bottom navigation)
- tapOn:
    point: "88%,95%"

- waitForAnimationToEnd

# Take screenshot of Profile screen
- takeScreenshot: profile-screen.png

# Tap on Leave requests (visible without scrolling)
# Try different possible text variations
- runFlow:
    when:
      visible: "Leave Requests|Leave Request|.*[Ll]eave.*|.*休暇.*|.*申請.*"
    commands:
      - tapOn: "Leave Requests|Leave Request|.*[Ll]eave.*|.*休暇.*|.*申請.*"

- runFlow:
    when:
      visible: ".*[Ll]eave.*|.*休暇.*|.*申請.*"
    commands:
      - tapOn:
          text: ".*[Ll]eave.*|.*休暇.*|.*申請.*"

- waitForAnimationToEnd

- assertVisible: "My Leaves|Pending Reviews|Leave Requests|休暇"

# Should now be on "My Leaves" page
# Capture current leave balance before submission
- takeScreenshot: before-leave-balance.png

# Tap the + button to create a new leave request (SVG icon in top-right)
- tapOn:
    point: "92%,8%"

- waitForAnimationToEnd

# Take screenshot of the new request form
- takeScreenshot: new-request-form.png

# Leave Type is already pre-selected (Vacation or default)
# Dates are already pre-filled with today's date
# We can proceed directly to add a reason

# Add reason/notes in the text field
- tapOn: 'Enter reason for leave \(optional\)|Reason|理由'
- inputText: "Feeling unwell, need rest"

# Wait for any animations
- waitForAnimationToEnd

# Tap the Submit button
- tapOn: "Submit|送信|申請"

- waitForAnimationToEnd

# Verify submission success
# 1. Status should be "Pending"
- assertVisible:
    text: ".*[Pp]ending.*"

# 2. New record should appear in the list
- takeScreenshot: after-submission-list.png

# 3. Verify balance is deducted (pre-deducted)
- takeScreenshot: after-leave-balance.png

# Verify the leave request details
- runFlow:
    when:
      visible: ".*[Ss]ick.*[Ll]eave.*"
    commands:
      - assertVisible:
          text: ".*[Ss]ick.*[Ll]eave.*"

# Success message or confirmation
- runFlow:
    when:
      visible: ".*[Ss]uccess.*|.*[Ss]ubmitted.*"
    commands:
      - assertVisible:
          text: ".*[Ss]uccess.*|.*[Ss]ubmitted.*"

