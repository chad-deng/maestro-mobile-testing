appId: com.storehub.salonx.staff.dev
tags:
  - role-permission
  - staff
  - customer-info
  - P0
---
# ROLE-002: Staff Cannot View Basic Customer Info
# Description: Login as Staff and verify basic customer info is hidden
# Expected: Staff cannot see basic info (address, phone number) on customer details
# Role: Staff (chad.deng+112@storehub.com)

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

# Wait for app to load
- waitForAnimationToEnd

# Reset to login if a previous test left the app signed in
- runFlow:
    when:
      visible: "Profile|プロフィール|個人"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd
      - tapOn: "Sign Out|ログアウト"

- runFlow:
    when:
      visible: "Confirm|確認"
    commands:
      - tapOn: "Confirm|確認"

- runFlow:
    when:
      visible: "Yes|はい"
    commands:
      - tapOn: "Yes|はい"

- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

- waitForAnimationToEnd

# Login as Staff
- tapOn: "Enter your email"
- eraseText
- tapOn: "Enter your email"
- eraseText
- inputText: "chad.deng+112@storehub.com"
- assertVisible: 'chad.deng\+112@storehub\.com'

- tapOn: "Enter your password"
- eraseText
- tapOn: "Enter your password"
- eraseText
- inputText: 12345678

- tapOn:
    text: "Sign In"
    index: 1

- waitForAnimationToEnd

# Handle store selection if it appears
- runFlow:
    when:
      visible: "auto_test"
    commands:
      - tapOn:
          text: "auto_test"
          index: 0
      - tapOn: "Confirm|確認"
      - waitForAnimationToEnd

# Verify successful login
- assertVisible: "Profile|プロフィール|個人"

# Navigate to Customer tab
- tapOn: "Customer|Customers|顧客|顧客管理"

- waitForAnimationToEnd

# Take screenshot of customer list
- takeScreenshot: staff-customer-list.png

# Tap on first customer to view details
- runFlow:
    when:
      visible: ".*@.*"
    commands:
      - tapOn:
          text: ".*@.*"
          index: 0

- runFlow:
    when:
      visible: "Test.*"
    commands:
      - tapOn:
          text: "Test.*"
          index: 0

- waitForAnimationToEnd

# Take screenshot of customer details
- takeScreenshot: staff-customer-details.png

# Verify Staff CANNOT see basic customer info (should be hidden)
# Address should NOT be visible
- assertNotVisible:
    text: ".*[Aa]ddress.*"

# Phone number should NOT be visible
- assertNotVisible:
    text: ".*[Pp]hone.*"

# Take final screenshot for verification
- takeScreenshot: staff-basic-info-hidden.png

# Cleanup: return to login page after validation
- back
- waitForAnimationToEnd
- tapOn: "Profile|プロフィール|個人"
- waitForAnimationToEnd
- tapOn: "Sign Out|ログアウト"

- runFlow:
    when:
      visible: "Confirm|確認"
    commands:
      - tapOn: "Confirm|確認"

- runFlow:
    when:
      visible: "Yes|はい"
    commands:
      - tapOn: "Yes|はい"

- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

- assertVisible: "Enter your email"
- assertVisible: "Enter your password"
