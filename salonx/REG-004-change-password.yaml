appId: com.storehub.salonx.staff.dev
tags:
  - registration
  - security
  - password
  - P1
---
# REG-004: Security - Change Password
# Description: Navigate to Account Settings > Change Password
# Expected: "Change Password" screen displays Current, New, and Confirm password fields with validation rules

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

# Login
- tapOn: "Enter your email"
- eraseText
- tapOn: "Enter your email"
- eraseText
- inputText: "owner@demo.com"
- tapOn: "Enter your password"
- eraseText
- inputText: password123
- tapOn:
    text: "Sign In"
    index: 1
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Salon.*"
    commands:
      - tapOn:
          text: "Salon.*"
          index: 0
      - tapOn: "Confirm"

# Navigate to Profile tab
- assertVisible: "Profile"
- tapOn:
    point: "88%,95%"

# Look for Account Settings or Security option
- runFlow:
    when:
      visible: "Account Settings"
    commands:
      - tapOn: "Account Settings"

# Alternative: Look for Security option
- runFlow:
    when:
      visible: "Security"
    commands:
      - tapOn: "Security"

# Alternative: Scroll to find Change Password option
- runFlow:
    when:
      notVisible: "Change Password"
    commands:
      - scrollUntilVisible:
          element:
            text: "Change Password"
          direction: "DOWN"

# Tap on Change Password
- tapOn: "Change Password"

# Verify Change Password screen is displayed
- assertVisible: "Change Password"

# Verify all required password fields are present
- assertVisible:
    text: "Current.*[Pp]assword"

- assertVisible:
    text: "New.*[Pp]assword"

- assertVisible:
    text: "Confirm.*[Pp]assword"

# Verify validation rules/hints are displayed
- runFlow:
    when:
      visible: "Password must"
    commands:
      - assertVisible: "Password must"

# Alternative validation text
- runFlow:
    when:
      visible: "at least"
    commands:
      - assertVisible: "at least"

# Test validation: Try to submit with empty fields
- tapOn: "Save"

# Verify error messages appear for empty fields
- runFlow:
    when:
      visible: "required"
    commands:
      - assertVisible: "required"

# Test validation: Enter mismatched passwords
- tapOn:
    text: "Current.*[Pp]assword"
- inputText: "password123"

- tapOn:
    text: "New.*[Pp]assword"
- inputText: "newPassword123"

- tapOn:
    text: "Confirm.*[Pp]assword"
- inputText: "differentPassword123"

- tapOn: "Save"

# Verify mismatch error appears
- runFlow:
    when:
      visible: "match"
    commands:
      - assertVisible: "match"

# Alternative error message
- runFlow:
    when:
      visible: "do not match"
    commands:
      - assertVisible: "do not match"

