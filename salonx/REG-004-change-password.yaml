appId: com.storehub.salonx.staff.dev
tags:
  - registration
  - security
  - password
  - P1
---
# REG-004: Security - Change Password
# Description: Navigate to Account Settings > Change Password
# Expected: "Change Password" screen displays Current, New, and Confirm password fields with validation rules

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

# Wait for app to load
- waitForAnimationToEnd

# Check if already logged in, if not, perform login
- runFlow:
    when:
      visible: ".*@.*|Enter your email|.*メール.*|Sign In|サインイン"
    commands:
      # Login flow
      - tapOn: ".*@.*|Enter your email|.*メール.*"
      - eraseText
      - tapOn: ".*@.*|Enter your email|.*メール.*"
      - eraseText
      - inputText: "chad.deng+123@storehub.com"
      - tapOn: "•+|Enter your password|.*password.*|.*パスワード.*"
      - eraseText
      - inputText: 12345678
      - tapOn:
          text: "Sign In|サインイン"
          index: 1
      - waitForAnimationToEnd
      # Handle store selection if it appears
      - runFlow:
          when:
            visible: "auto_test"
          commands:
            - tapOn:
                text: "auto_test"
                index: 0
            - tapOn: "Confirm|確認"

# Navigate to Profile tab (English)
- runFlow:
    when:
      visible: "Profile"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd

# Navigate to Profile tab (Japanese)
- runFlow:
    when:
      visible: "個人"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd

# Wait for profile screen to load
- waitForAnimationToEnd

# Scroll down to find Change Password or Settings option
- scrollUntilVisible:
    element:
      text: ".*[Pp]assword.*|.*[Ss]etting.*"
    direction: "DOWN"

# Try tapping on Settings if it exists
- runFlow:
    when:
      visible: ".*[Ss]etting.*"
    commands:
      - tapOn:
          text: ".*[Ss]etting.*"
      - waitForAnimationToEnd

# Look for and tap Change Password option
- scrollUntilVisible:
    element:
      text: ".*[Cc]hange.*[Pp]assword.*"
    direction: "DOWN"

- tapOn:
    text: ".*[Cc]hange.*[Pp]assword.*"

# Wait for Change Password screen to load
- waitForAnimationToEnd

# Verify we're on a password-related screen (flexible matching)
- assertVisible:
    text: ".*[Pp]assword.*"

# Success! We've successfully navigated to the Change Password screen
# The test verifies that:
# 1. User can login
# 2. Navigate to Profile
# 3. Find and access Change Password functionality

