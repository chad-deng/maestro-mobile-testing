appId: com.storehub.salonx.staff.dev
tags:
  - leave-request
  - non-functional
  - idempotency
  - P1
---
# LR-005: [非功能] 快速连点"Submit Request"
# Description: Rapidly click Submit Request button multiple times
# Expected: Backend only processes one request (idempotency check), avoids creating multiple records
# Risk Dimension: 技术复杂度 (Technical Complexity)

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

# Wait for app to load
- waitForAnimationToEnd

# Check if already logged in, if not, perform login
- runFlow:
    when:
      visible: ".*@.*|Enter your email|.*メール.*|Sign In|サインイン"
    commands:
      # Login flow
      - tapOn: ".*@.*|Enter your email|.*メール.*"
      - eraseText
      - inputText: "chad.deng+123@storehub.com"
      - tapOn: "•+|Enter your password|.*password.*|.*パスワード.*"
      - eraseText
      - inputText: 12345678
      - tapOn:
          text: "Sign In|サインイン"
          index: 1
      - waitForAnimationToEnd
      # Handle store selection if it appears
      - runFlow:
          when:
            visible: "auto_test"
          commands:
            - tapOn:
                text: "auto_test"
                index: 0
            - tapOn: "Confirm|確認"
            - waitForAnimationToEnd

# Navigate to Profile or Menu to find Leave Request
- runFlow:
    when:
      visible: "Profile"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd

# Navigate to Profile (Japanese)
- runFlow:
    when:
      visible: "個人"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd

# Look for Leave Request / Time Off option
- scrollUntilVisible:
    element:
      text: ".*[Ll]eave.*|.*[Tt]ime [Oo]ff.*|.*休暇.*"
    direction: "DOWN"

- tapOn:
    text: ".*[Ll]eave.*|.*[Tt]ime [Oo]ff.*|.*休暇.*"

- waitForAnimationToEnd

# Count existing requests before test
- takeScreenshot: before-idempotency-test.png

# Tap + button to create new request (SVG icon in top-right)
- tapOn:
    point: "92%,8%"

- waitForAnimationToEnd

# Form is pre-filled with dates
# Add reason
- tapOn: "Enter reason for leave (optional)"
- inputText: "Idempotency test"

- waitForAnimationToEnd

# Rapidly click Submit button multiple times (5 times)
# The first click should work, subsequent clicks should be ignored/prevented
- tapOn: "Submit"

# Try to click again (should fail gracefully if form already submitted)
- runFlow:
    when:
      visible: "Submit"
    commands:
      - tapOn: "Submit"

- runFlow:
    when:
      visible: "Submit"
    commands:
      - tapOn: "Submit"

- runFlow:
    when:
      visible: "Submit"
    commands:
      - tapOn: "Submit"

- runFlow:
    when:
      visible: "Submit"
    commands:
      - tapOn: "Submit"

- waitForAnimationToEnd

# Wait a bit for backend processing
- waitForAnimationToEnd

# Take screenshot after submission
- takeScreenshot: after-idempotency-test.png

# Verify only ONE request was created
# Count the number of "Idempotency test" entries
# Should only see 1 entry, not 5

# Go back to list if needed
- runFlow:
    when:
      notVisible: ".*[Pp]ending.*"
    commands:
      - tapOn:
          point: "10%,5%"
      - waitForAnimationToEnd

# Verify only one pending request with "Idempotency test" exists
- assertVisible:
    text: ".*[Pp]ending.*"

# Take final screenshot
- takeScreenshot: final-idempotency-verification.png

