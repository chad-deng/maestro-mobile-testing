appId: com.storehub.salonx.staff.dev
tags:
  - registration
  - forgot-password
  - P1
---
# REG-001: Forgot Password Flow
# Description: Trigger "Forgot Password" flow, enter email, and proceed to verification
# Expected: User reaches the "Enter Verification Code" screen with a 60s resend timer

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

# Wait for login screen to load
- waitForAnimationToEnd

# Look for and tap "Forgot Password" link
- runFlow:
    when:
      visible: "Forgot Password"
    commands:
      - tapOn: "Forgot Password"

# Alternative: Scroll to find Forgot Password if not visible
- runFlow:
    when:
      notVisible: "Forgot Password"
    commands:
      - scrollUntilVisible:
          element:
            text: "Forgot Password"
          direction: "DOWN"
      - tapOn: "Forgot Password"

# Verify we're on the Forgot Password screen
- assertVisible: "Forgot Password"
- assertVisible: "Enter your email"

# Enter email address
- tapOn: "Enter your email"
- eraseText
- inputText: "owner@demo.com"

# Submit the forgot password request
- tapOn: "Send"

# Verify we reach the verification code screen
- assertVisible: "Enter Verification Code"
- assertVisible: "We've sent a verification code to"
- assertVisible: "owner@demo.com"

# Verify the resend timer is present (60s countdown)
- assertVisible: "Resend code in"

# Optional: Wait a moment to see the timer counting down
- waitForAnimationToEnd

# Verify the verification code input field is present
- assertVisible:
    text: "Enter.*code"
    

