appId: com.storehub.salonx.staff.dev
tags:
  - registration
  - forgot-password
  - P1
---
# REG-001: Forgot Password Flow
# Description: Trigger "Forgot Password" flow, enter email, and proceed to verification
# Expected: User reaches the "Enter Verification Code" screen with a 60s resend timer

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

# Wait for screen to load
- waitForAnimationToEnd

# If already logged in, logout first
- runFlow:
    when:
      visible: "Profile"
    commands:
      # Navigate to Profile tab
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd
      # Scroll down to find Sign Out
      - scrollUntilVisible:
          element:
            text: "Sign Out"
          direction: "DOWN"
      - tapOn: "Sign Out"
      - waitForAnimationToEnd

# If already logged in (Japanese), logout first
- runFlow:
    when:
      visible: "個人"
    commands:
      # Navigate to Profile tab
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd
      # Scroll down to find ログアウト
      - scrollUntilVisible:
          element:
            text: "ログアウト"
          direction: "DOWN"
      - tapOn: "ログアウト"
      - waitForAnimationToEnd

# Wait for login screen to appear
- waitForAnimationToEnd

# Tap on "Forgot Password" link (using regex to match any case variation)
- tapOn:
    text: "Forgot.*"

# Wait for the forgot password screen to load
- waitForAnimationToEnd

# Verify we're on the Forgot Password screen (flexible matching)
- assertVisible:
    text: ".*email.*"

# Enter email address - try to find the email input field
- tapOn:
    text: ".*email.*"
- eraseText
- inputText: "owner@demo.com"

# Submit the forgot password request - look for Send/Submit button
- runFlow:
    when:
      visible: "Send"
    commands:
      - tapOn: "Send"

- runFlow:
    when:
      visible: "Submit"
    commands:
      - tapOn: "Submit"

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

# Wait for response
- waitForAnimationToEnd

# Verify we reach some kind of confirmation or verification screen
# (Being flexible since we don't know the exact text)
- assertVisible:
    text: ".*"
    

