appId: com.storehub.salonx.staff.dev
tags:
  - registration
  - forgot-password
  - P1
---
# REG-001: Forgot Password Flow
# Description: Trigger "Forgot Password" flow, enter email, and proceed to verification
# Expected: User reaches the "Enter Verification Code" screen with a 60s resend timer

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

# Wait for screen to load
- waitForAnimationToEnd

# Finish any leftover store picker before resetting to login
- runFlow:
    when:
      visible: "Switch Store|Select Store|.*店舗.*|.*事業.*切.*|.*事业.*切.*|auto_test"
    commands:
      - tapOn:
          text: "auto_test"
          index: 0
      - tapOn: "Confirm|確認|确认|確定|确定"
      - waitForAnimationToEnd

# If already on a signed-in root screen, logout first
- runFlow:
    when:
      visible: "Dashboard|Appointments|Customers|Profile|ダッシュボード|予約|顧客|個人"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd
      - tapOn: "Sign Out|ログアウト"
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "Confirm|確認|确认|確定|确定"
    commands:
      - tapOn: "Confirm|確認|确认|確定|确定"

- runFlow:
    when:
      visible: "Yes|はい"
    commands:
      - tapOn: "Yes|はい"

- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

# Wait for login screen to appear
- waitForAnimationToEnd

- assertVisible: "Forgot.*|パスワードを忘れた.*"

# Tap on "Forgot Password" link (using regex to match any case variation)
- tapOn:
    text: "Forgot.*|パスワードを忘れた.*"

# Wait for the forgot password screen to load
- waitForAnimationToEnd

# Verify we're on the Forgot Password screen (flexible matching)
- assertVisible:
    text: ".*email.*|.*メール.*"

# Enter email address - try to find the email input field
- tapOn:
    text: ".*email.*|.*メール.*"
- eraseText
- inputText: "chad.deng+123@storehub.com"

# Submit the forgot password request - look for Send/Submit button
- runFlow:
    when:
      visible: "Send"
    commands:
      - tapOn: "Send"

- runFlow:
    when:
      visible: "Submit"
    commands:
      - tapOn: "Submit"

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

# Wait for response
- waitForAnimationToEnd

# Verify we reach some kind of confirmation or verification screen
# (Being flexible since we don't know the exact text)
- assertVisible:
    text: ".*"
    

