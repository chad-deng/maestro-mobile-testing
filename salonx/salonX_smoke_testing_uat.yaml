appId: com.storehub.salonx.staff.dev
---
- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    permissions:
      all: "allow"
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"
- extendedWaitUntil:
    visible: ".*"
    timeout: 5000

# Wait a bit more for the app to settle
- waitForAnimationToEnd

# Check multiple possible states and handle accordingly
# State 1: Already logged in with Profile visible
- runFlow:
    when:
      visible: "Profile|プロフィール|個人"
    commands:
      - evalScript: ${console.log("Already logged in")}

# State 2: Login screen is visible
- runFlow:
    when:
      visible: "Enter your email|Sign In|ログイン"
    commands:
      - tapOn: "Enter your email"
      - eraseText
      - inputText: "chad.deng+123@storehub.com"
      - tapOn: "Enter your password"
      - eraseText
      - inputText: 12345678
      - tapOn:
          text: "Sign In"
          index: 1
      - extendedWaitUntil:
          visible: ".*"
          timeout: 10000

# State 3: Store selection screen
- runFlow:
    when:
      visible: "Switch Store|Select Store|店舗"
    commands:
      - tapOn: "auto_test"
      - tapOn: "Confirm"
      - extendedWaitUntil:
          visible: "Profile|プロフィール"
          timeout: 15000

# Additional wait for any remaining animations
- waitForAnimationToEnd

# Now assert Profile is visible (with multiple language options)
- assertVisible:
    text: "Profile|プロフィール|個人|Dashboard|ダッシュボード"
- tapOn:
    point: "88%,95%"
- assertVisible: "Language Settings|言語設定"
- tapOn: "Language Settings|言語設定"
- assertVisible: "日本語"
- tapOn:
    point: "50%,24%"
- waitForAnimationToEnd
- tapOn: "ホーム|ダッシュボード"
# - doubleTapOn:
#     point: 90%,74%
# Only interact with "完了" (Completed) if there are completed appointments
- runFlow:
    when:
      visible: 完了.*
    commands:
      - runFlow:
          when:
            notVisible: 完了.*
          commands:
            - scrollUntilVisible:
                element:
                  text: 完了.*
                direction: "DOWN"
      - tapOn: 完了.*
      - scrollUntilVisible:
          element:
            text: こんにちは、中村 健
          direction: "UP"
      - assertVisible: "こんにちは、中村 健"
- tapOn:
    text: 予約
    index: -1
#- tapOn: "予約"
- assertVisible: 予約を検索...
- waitForAnimationToEnd
#- assertVisible: "スタッフ、顧客、メール、または電話番号で検索..."
#- runFlow: subflow/add_customer_booking.yaml
- tapOn: "顧客|顧客管理"
- assertNotVisible: 顧客が見つかりません
- tapOn: "個人|プロフィール"
#- tapOn: "プロフィール"
- assertVisible: 言語設定, 日本語
- tapOn: 言語設定, 日本語
- tapOn: English
- assertVisible: Sign Out
- tapOn: Sign Out

# - assertVisible: "取得したバッジ, 0/15"
#- tapOn: "ログアウト"
- killApp: com.storehub.salonx.staff.dev