appId: com.storehub.salonx.staff.dev
---
- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    permissions:
      all: "allow"

# ─── Entry point ────────────────────────────────────────────────────────────
# Wait until a meaningful, recognizable screen state appears (up to 30 s).
# This covers every possible launch path:
#   • Expo Dev Client OTA screen  → "Open Latest"
#   • Legacy in-app update prompt → "Install Now"
#   • SalonX login screen         → "Enter your email"
#   • SalonX home (already in)    → "Profile / プロフィール / 個人 / Dashboard / ダッシュボード"
- extendedWaitUntil:
    visible: "Open Latest|Install Now|Enter your email|Profile|プロフィール|個人|Dashboard|ダッシュボード"
    timeout: 30000
- waitForAnimationToEnd

# State 0a: Expo Dev Client — OTA update screen
- runFlow:
    when:
      visible: "Open Latest"
    commands:
      - tapOn: "Open Latest"
      - extendedWaitUntil:
          visible: "Enter your email|Profile|プロフィール|個人|Dashboard|ダッシュボード"
          timeout: 20000
      - waitForAnimationToEnd

# State 0b: Legacy "Install Now" in-app update prompt
- runFlow:
    when:
      visible: "Install Now"
    commands:
      - tapOn: "Install Now"
      - waitForAnimationToEnd

# ─── SalonX app states ──────────────────────────────────────────────────────
# State 1: Already logged in
- runFlow:
    when:
      visible: "Profile|プロフィール|個人"
    commands:
      - evalScript: ${console.log("Already logged in")}

# State 2: Login screen
- runFlow:
    when:
      visible: "Enter your email|Sign In|ログイン"
    commands:
      # Double-tap + double-erase resets IME state, preventing .com from
      # being swallowed by keyboard autocorrect or a mid-switch animation.
      - tapOn: "Enter your email"
      - eraseText
      - tapOn: "Enter your email"
      - eraseText
      - inputText: "chad.deng+123@storehub.com"
      # Guard: confirm the full email (including .com) was actually typed
      - assertVisible: "chad.deng+123@storehub.com"
      - tapOn: "Enter your password"
      - eraseText
      - tapOn: "Enter your password"
      - eraseText
      - inputText: 12345678
      - tapOn:
          text: "Sign In"
          index: 1
      - extendedWaitUntil:
          visible: ".*"
          timeout: 10000

# State 3: Store selection screen
- runFlow:
    when:
      visible: "Switch Store|Select Store|店舗"
    commands:
      - tapOn: "auto_test"
      - tapOn: "Confirm"
      - extendedWaitUntil:
          visible: "Profile|プロフィール"
          timeout: 15000

- waitForAnimationToEnd

# ─── Main smoke flow ─────────────────────────────────────────────────────────
# Verify home screen reached
- assertVisible:
    text: "Profile|プロフィール|個人|Dashboard|ダッシュボード"

# Open profile/settings and switch language to Japanese
- tapOn:
    point: "88%,95%"
- assertVisible: "Language Settings|言語設定"
- tapOn: "Language Settings|言語設定"
- assertVisible: "日本語"
- tapOn:
    point: "50%,24%"
- waitForAnimationToEnd
- tapOn: "ホーム|ダッシュボード"

# Check for completed appointments (optional — skipped if none exist)
- runFlow:
    when:
      visible: 完了.*
    commands:
      - runFlow:
          when:
            notVisible: 完了.*
          commands:
            - scrollUntilVisible:
                element:
                  text: 完了.*
                direction: "DOWN"
      - tapOn: 完了.*
      - scrollUntilVisible:
          element:
            text: こんにちは、中村 健
          direction: "UP"
      - assertVisible: "こんにちは、中村 健"

# Appointments tab
- tapOn:
    text: 予約
    index: -1
- assertVisible: 予約を検索...
- waitForAnimationToEnd

# Customers tab
- tapOn: "顧客|顧客管理"
- assertNotVisible: 顧客が見つかりません

# Profile tab — switch language back to English and sign out
- tapOn: "個人|プロフィール"
- assertVisible: 言語設定, 日本語
- tapOn: 言語設定, 日本語
- tapOn: English
- assertVisible: Sign Out
- tapOn: Sign Out
- killApp: com.storehub.salonx.staff.dev