appId: com.storehub.salonx.staff.dev
tags:
  - registration
  - login
  - P0
---
# REG-002: Login Flow
# Description: Enter valid credentials and select a store
# Expected: User successfully logs in and is redirected to the Dashboard

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

# Wait for login screen to load
- waitForAnimationToEnd

# Enter email
- tapOn: "Enter your email"
- eraseText
- tapOn: "Enter your email"
- eraseText
- inputText: "owner@demo.com"

# Enter password
- tapOn: "Enter your password"
- eraseText
- inputText: password123

# Tap Sign In button
- tapOn:
    text: "Sign In"
    index: 1

# Wait for store selection or dashboard to load
- waitForAnimationToEnd

# Handle store selection if it appears
- runFlow:
    when:
      visible: "Salon.*"
    commands:
      # Select the first store (using regex to match any Salon name)
      - tapOn:
          text: "Salon.*"
          index: 0
      # Confirm store selection
      - tapOn: "Confirm"

# Verify successful login - Dashboard/Home screen elements
- assertVisible: "Profile"

# Verify we can see the main navigation tabs
- runFlow:
    when:
      visible: "Home"
    commands:
      - assertVisible: "Home"

# Alternative: Check for Japanese home if language is set to Japanese
- runFlow:
    when:
      visible: "ホーム"
    commands:
      - assertVisible: "ホーム"

# Verify other main tabs are present
- runFlow:
    when:
      visible: "Appointments"
    commands:
      - assertVisible: "Appointments"

- runFlow:
    when:
      visible: "予約"
    commands:
      - assertVisible: "予約"

