appId: com.storehub.salonx.staff.dev
tags:
  - registration
  - login
  - P0
---
# REG-002: Login Flow
# Description: Enter valid credentials and select a store
# Expected: User successfully logs in and is redirected to the Dashboard

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

# Enter email (using exact same approach as working UAT test)
- tapOn: ".*@.*|Enter your email|.*メール.*"
- eraseText
- tapOn: ".*@.*|Enter your email|.*メール.*"
- eraseText
- inputText: "chad.deng+123@storehub.com"

# Enter password
- tapOn: "•+|Enter your password|.*password.*|.*パスワード.*"
- eraseText
- inputText: 12345678

# Tap Sign In button
- tapOn:
    text: "Sign In|サインイン"
    index: 1

# Wait for store selection or dashboard to load
- waitForAnimationToEnd

# Handle store selection if it appears
- runFlow:
    when:
      visible: "auto_test"
    commands:
      # Select the first store (using regex to match any Salon name)
      - tapOn:
          text: "auto_test"
          index: 0
      # Confirm store selection
      - tapOn: "Confirm|確認|确认|確定|确定"

# Verify successful login - Dashboard/Home screen elements
- assertVisible: "Profile|プロフィール|個人"

# Verify we can see the main navigation tabs
- runFlow:
    when:
      visible: "Home"
    commands:
      - assertVisible: "Home"

# Alternative: Check for Japanese home if language is set to Japanese
- runFlow:
    when:
      visible: "ホーム"
    commands:
      - assertVisible: "ホーム"

# Verify other main tabs are present
- runFlow:
    when:
      visible: "Appointments"
    commands:
      - assertVisible: "Appointments"

- runFlow:
    when:
      visible: "予約"
    commands:
      - assertVisible: "予約"

