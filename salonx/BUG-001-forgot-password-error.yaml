appId: com.storehub.salonx.staff.dev
tags:
  - bug
  - forgot-password
  - P1
  - regression
---
# BUG-001: "Failed to send reset email" error on Forgot Password screen
# Bug ID: recoLUkZ5g
# Platform: Android, iOS
#
# Description: When user attempts to reset password, system shows error instead of sending verification code
#
# Steps to Reproduce:
# 1. Navigate to Sign-in screen and click "Forgot Password?"
# 2. Enter a registered email address
# 3. Click the "Send Verification Code" button
# 4. Observe the result
#
# Expected: System sends reset code and transitions to "Enter Verification Code" screen
# Actual (Bug): Email not sent, error message appears

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

- waitForAnimationToEnd

# If already logged in, logout first (English)
- runFlow:
    when:
      visible: "Profile"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: "Sign Out"
          direction: "DOWN"
      - tapOn: "Sign Out"
      - waitForAnimationToEnd

# If already logged in, logout first (Japanese)
- runFlow:
    when:
      visible: "個人"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: "ログアウト"
          direction: "DOWN"
      - tapOn: "ログアウト"
      - waitForAnimationToEnd

- waitForAnimationToEnd

# Step 1: Tap on "Forgot Password" link
- tapOn:
    text: "Forgot.*|パスワードを忘れた.*"

- waitForAnimationToEnd

# Step 2: Enter a registered email address
- tapOn:
    text: ".*email.*|.*メール.*"
- eraseText
- inputText: "qa@storehub.com"

# Step 3: Click Send Verification Code button
- runFlow:
    when:
      visible: "Send.*"
    commands:
      - tapOn: "Send.*"

- runFlow:
    when:
      visible: "認証コードを送信"
    commands:
      - tapOn: "認証コードを送信"

- waitForAnimationToEnd

# Step 4: Verify we reach verification code screen (NOT error)
# Bug verification: Should NOT see error message
- runFlow:
    when:
      visible: ".*[Ff]ailed.*|.*エラー.*|.*失敗.*"
    commands:
      # If error is visible, the bug is NOT fixed - fail the test
      - assertNotVisible: ".*[Ff]ailed.*"

# Expected: Verification code screen should appear
- runFlow:
    when:
      visible: ".*[Vv]erification.*[Cc]ode.*|.*認証コード.*|.*確認.*"
    commands:
      - assertVisible: ".*[Vv]erification.*[Cc]ode.*|.*認証コード.*|.*確認.*"

# Alternative success: Timer/resend visible indicates success
- runFlow:
    when:
      visible: ".*[Rr]esend.*|.*再送.*|.*60.*"
    commands:
      - assertVisible: ".*[Rr]esend.*|.*再送.*|.*60.*"
