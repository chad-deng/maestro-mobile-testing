appId: jp.naver.line.android
tags:
  - line
  - subflow
---
- launchApp:
    appId: "jp.naver.line.android"
    clearState: false
    stopApp: true
    permissions:
      all: "allow"
- runFlow:
    when:
      visible: "許可|Allow"
    commands:
      - tapOn: "許可|Allow"
- extendedWaitUntil:
    visible: ".*ホーム.*|.*Home.*|.*トーク.*|.*Talk.*|LINE"
    timeout: 15000
- openLink: "https://liff.line.me/2007999586-3BRrPMpQ/booking/01KB546VWPFMKTT7VZJ5HC98DG/services?source=line"
- extendedWaitUntil:
    visible: ".*[Bb]ook.*|.*予約.*|.*[Ss]tore.*|.*店舗.*|.*[Ss]ervice.*|.*サービス.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
