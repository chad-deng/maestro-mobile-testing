appId: jp.naver.line.android
tags:
  - line
  - subflow
---
# Step 1: メニュー選択 — select a service
- takeScreenshot: "step1-menu"
- tapOn:
    index: 0
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "続ける"
- waitForAnimationToEnd:
    timeout: 3000

# Step 2: 日時指名 — select date, time, and staff
- takeScreenshot: "step2-datetime"
# Select first available staff or "no preference"
- runFlow:
    when:
      visible: ".*指名.*|.*[Ss]taff.*|.*スタッフ.*|.*[Ss]tylist.*"
    commands:
      - tapOn:
          index: 0
      - waitForAnimationToEnd:
          timeout: 2000

# Select a date — look for day numbers with weekday labels like "14 (木)"
- runFlow:
    when:
      visible: ".*\\([月火水木金土日]\\)"
    commands:
      - tapOn:
          index: 1
      - waitForAnimationToEnd:
          timeout: 2000

# Select first available time slot
- runFlow:
    when:
      visible: ".*[0-9]+:[0-9]+.*"
    commands:
      - tapOn:
          index: 0
      - waitForAnimationToEnd:
          timeout: 2000

# Continue to step 3
- tapOn: "続ける"
- waitForAnimationToEnd:
    timeout: 5000

# Step 3: 情報入力 — fill customer info
- takeScreenshot: "step3-info"
# Fill all input fields by index (they're form fields in order)
- tapOn:
    index: 0
- eraseText
- inputText: "Test Customer"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    index: 1
- eraseText
- inputText: "09012345678"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    index: 2
- eraseText
- inputText: "test.customer@example.com"
- waitForAnimationToEnd:
    timeout: 1000

# Continue to step 4
- tapOn: "続ける"
- waitForAnimationToEnd:
    timeout: 5000

# Step 4: 予約確認 — review and confirm
- takeScreenshot: "step4-confirm"
- tapOn: "予約する|確定する|予約を確定|Book|Confirm"
- waitForAnimationToEnd:
    timeout: 5000
