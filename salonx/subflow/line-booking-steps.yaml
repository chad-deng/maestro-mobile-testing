appId: jp.naver.line.android
tags:
  - line
  - subflow
---
# Step 1: メニュー選択 — select first service (conditional, may be skipped if cached)
- runFlow:
    when:
      visible: "カラー|カット|パーマ|トリートメント|メニュー"
    commands:
      - takeScreenshot: "step1-before-select"
      - tapOn:
          point: "30%,45%"
      - waitForAnimationToEnd:
          timeout: 2000
      - scrollUntilVisible:
          element:
            text: "続ける"
          direction: "DOWN"
      - tapOn: "続ける"
      - waitForAnimationToEnd:
          timeout: 5000

# Step 2: 日時指名 — date and time selection (conditional, often auto-advanced)
- takeScreenshot: "step2-after-step1"
- runFlow:
    when:
      visible: "ご希望の日時"
    commands:
      - tapOn:
          point: "35%,89%"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: "step2-after-date-select"
      - scroll
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: "step2-time-grid"
      - tapOn:
          point: "35%,40%"
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: "step2-after-time-select"
      - tapOn: "続ける"
      - waitForAnimationToEnd:
          timeout: 5000

# Step 3: 情報入力 — customer info (conditional)
- takeScreenshot: "step3-before-fix"
- runFlow:
    when:
      visible: "フリガナ"
    commands:
      - tapOn: "フリガナ"
      - waitForAnimationToEnd:
          timeout: 1000
      - eraseText
      # Clipboard must be pre-loaded with katakana before running this test:
      # adb shell service call clipboard 1 i32 1 s16 "テスト"
      - pasteText
      - waitForAnimationToEnd:
          timeout: 1000
      - takeScreenshot: "step3-after-furigana"
      - scrollUntilVisible:
          element:
            text: "続ける"
          direction: "DOWN"
      - tapOn: "続ける"
      - waitForAnimationToEnd:
          timeout: 5000

# Step 4: 予約確認 — final booking confirmation
- takeScreenshot: "step4-confirm"
- runFlow:
    when:
      visible: "この内容で予約する|予約内容をご確認"
    commands:
      - scrollUntilVisible:
          element:
            text: "この内容で予約する"
          direction: "DOWN"
      - tapOn: "この内容で予約する"
      - waitForAnimationToEnd:
          timeout: 5000
