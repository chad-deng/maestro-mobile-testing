appId: jp.naver.line.android
tags:
  - line
  - subflow
---
# Step 1: メニュー選択 — tap a service item
- takeScreenshot: "step1-menu"
- tapOn:
    index: 0
- waitForAnimationToEnd:
    timeout: 2000

# Step 1b: tap 続ける (Continue) — use point to avoid matching step indicators
- tapOn:
    point: "50%,95%"
- waitForAnimationToEnd:
    timeout: 3000

# Step 2: 日時指名 — date/time/staff selection
- takeScreenshot: "step2-datetime"
# Select first available staff or "any"
- runFlow:
    when:
      visible: ".*[Ss]taff.*|.*スタッフ.*|.*[Ss]tylist.*|.*指名.*|.*指定なし.*"
    commands:
      - tapOn:
          index: 0
      - waitForAnimationToEnd:
          timeout: 2000

# Select first available date
- runFlow:
    when:
      visible: ".*[0-9]+月.*|.*[Jj]an.*|.*[Ff]eb.*|.*[Mm]ar.*|.*[Aa]pr.*|.*[Mm]ay.*|.*[Jj]un.*|.*[Jj]ul.*|.*[Aa]ug.*|.*[Ss]ep.*|.*[Oo]ct.*|.*[Nn]ov.*|.*[Dd]ec.*"
    commands:
      - tapOn:
          index: 0
      - waitForAnimationToEnd:
          timeout: 2000

# Select first available time slot
- runFlow:
    when:
      visible: ".*[0-9]+:[0-9]+.*"
    commands:
      - tapOn:
          index: 0
      - waitForAnimationToEnd:
          timeout: 2000

# Proceed to step 3 — use point to avoid matching step indicators
- tapOn:
    point: "50%,95%"
- waitForAnimationToEnd:
    timeout: 3000

# Step 3: 情報入力 — customer info
- takeScreenshot: "step3-info"
# Name — broad match including placeholder text in input fields
- runFlow:
    when:
      visible: ".*名.*|.*[Nn]ame.*"
    commands:
      - tapOn:
          index: 0
      - eraseText
      - inputText: "Test Customer"
      - waitForAnimationToEnd:
          timeout: 1000

# Phone
- runFlow:
    when:
      visible: ".*電話.*|.*[Pp]hone.*|.*TEL.*|.*番号.*"
    commands:
      - tapOn:
          index: 0
      - eraseText
      - inputText: "09012345678"
      - waitForAnimationToEnd:
          timeout: 1000

# Email
- runFlow:
    when:
      visible: ".*メール.*|.*[Ee]mail.*|.*@.*"
    commands:
      - tapOn:
          index: 0
      - eraseText
      - inputText: "test.customer@example.com"
      - waitForAnimationToEnd:
          timeout: 1000

# Proceed to step 4 — use point to avoid matching step indicators
- tapOn:
    point: "50%,95%"
- waitForAnimationToEnd:
    timeout: 3000

# Step 4: 予約確認 — final booking confirmation
- takeScreenshot: "step4-confirm"
- tapOn:
    point: "50%,95%"
- waitForAnimationToEnd:
    timeout: 5000
