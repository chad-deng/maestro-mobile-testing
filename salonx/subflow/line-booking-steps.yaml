appId: jp.naver.line.android
tags:
  - line
  - subflow
---
# Step 0: 店舗情報 — store info page (conditional, appears on fresh LIFF load)
- runFlow:
    when:
      visible: "店舗情報|カレンダー"
    commands:
      - scrollUntilVisible:
          element:
            text: "続ける"
          direction: "DOWN"
      - tapOn: "続ける"
      - waitForAnimationToEnd:
          timeout: 5000

# Step 1: メニュー選択 — select service (conditional, may be skipped if cached)
- runFlow:
    when:
      visible: "メニューを選択してください|選択してください"
    commands:
      - takeScreenshot: "step1-before-select"
      # Tap on the service text label area — WebView checkboxes only respond to text taps, not checkbox icon taps
      - tapOn:
          point: "54%,74%"
      - waitForAnimationToEnd:
          timeout: 2000
      - scrollUntilVisible:
          element:
            text: "続ける"
          direction: "DOWN"
      - tapOn: "続ける"
      - waitForAnimationToEnd:
          timeout: 5000

# Step 2a: スタッフ選択 — staff selection (conditional, select default 指名なし)
- runFlow:
    when:
      visible: "スタッフを選択|スタッフを割り当て"
    commands:
      - scrollUntilVisible:
          element:
            text: "続ける"
          direction: "DOWN"
      - tapOn: "続ける"
      - waitForAnimationToEnd:
          timeout: 5000

# Step 2b: 日時選択 — date and time selection (conditional)
- runFlow:
    when:
      visible: "日時を選択してください|ご希望の日時"
    commands:
      - takeScreenshot: "step2-datetime"
      # Scroll down to reveal the time slot grid
      - scroll
      - waitForAnimationToEnd:
          timeout: 2000
      - scroll
      - waitForAnimationToEnd:
          timeout: 2000
      # Select a time slot using text-based tap (WebView grid cells only respond to text taps)
      - tapOn: "13:00"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: "step2-after-time-select"
      - tapOn: "続ける"
      - waitForAnimationToEnd:
          timeout: 5000

# Step 3: 情報入力 — customer info (conditional)
- takeScreenshot: "step3-before-fix"
- runFlow:
    when:
      visible: "フリガナ"
    commands:
      - tapOn: "フリガナ"
      - waitForAnimationToEnd:
          timeout: 1000
      - eraseText
      # Clipboard must be pre-loaded with katakana before running this test:
      # adb shell service call clipboard 1 i32 1 s16 "テスト"
      - pasteText
      - waitForAnimationToEnd:
          timeout: 1000
      - takeScreenshot: "step3-after-furigana"
      - scrollUntilVisible:
          element:
            text: "続ける"
          direction: "DOWN"
      - tapOn: "続ける"
      - waitForAnimationToEnd:
          timeout: 5000

# Step 4: 予約確認 — final booking confirmation
- takeScreenshot: "step4-confirm"
- runFlow:
    when:
      visible: "この内容で予約する|予約内容をご確認"
    commands:
      - scrollUntilVisible:
          element:
            text: "この内容で予約する"
          direction: "DOWN"
      # Use point-based tap on upper portion of button — WebView button center doesn't respond to taps
      - tapOn:
          point: "50%,94%"
      - waitForAnimationToEnd:
          timeout: 5000
