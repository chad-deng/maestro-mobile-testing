appId: jp.naver.line.android
tags:
  - line
  - subflow
---
# Step 0: 店舗情報 — store info page (conditional, appears on fresh LIFF load)
- runFlow:
    when:
      visible: "店舗情報|カレンダー"
    commands:
      - scrollUntilVisible:
          element:
            text: "続ける"
          direction: "DOWN"
      - tapOn: "続ける"
      - waitForAnimationToEnd:
          timeout: 5000

# Step 1: メニュー選択 — select service (conditional, may be skipped if cached)
- runFlow:
    when:
      visible: "メニューを選択してください|選択してください"
    commands:
      - takeScreenshot: "step1-before-select"
      # Bundle 2 is not bookable in UAT; use the single service that passed availability.
      - scroll
      - waitForAnimationToEnd:
          timeout: 1000
      - runFlow:
          when:
            notVisible: "選択済み"
          commands:
            # Text taps do not reliably toggle this WebView checkbox.
            - tapOn:
                point: "50%,39%"
      - waitForAnimationToEnd:
          timeout: 1000
      - runFlow:
          when:
            notVisible: "選択済み"
          commands:
            - tapOn:
                point: "50%,87%"
      - waitForAnimationToEnd:
          timeout: 2000
      - scrollUntilVisible:
          element:
            text: "続ける"
          direction: "DOWN"
      - tapOn: "続ける"
      - waitForAnimationToEnd:
          timeout: 5000

# Step 2a: スタッフ選択 — staff selection (conditional, select default 指名なし)
- runFlow:
    when:
      visible: ".*スタッフ.*選択.*|.*スタッフ.*割り当て.*|指名なし"
    commands:
      - takeScreenshot: "step2-staff"
      - tapOn: "指名なし"
      - waitForAnimationToEnd:
          timeout: 2000
      - scrollUntilVisible:
          element:
            text: "続ける"
          direction: "DOWN"
      - tapOn: "続ける"
      - waitForAnimationToEnd:
          timeout: 5000

# Step 2b: 日時選択 — date and time selection (conditional)
- runFlow:
    when:
      visible: ".*日時を選択してください.*|.*ご希望の日時.*"
    commands:
      - takeScreenshot: "step2-datetime"
      # Scroll down to reveal the time slot grid
      - scroll
      - waitForAnimationToEnd:
          timeout: 2000
      - scroll
      - waitForAnimationToEnd:
          timeout: 2000
      # Select first available slot in the next-day column. Time labels are row headers,
      # so tap the available circle cell rather than a hard-coded time string.
      - tapOn:
          point: "36%,32%"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: "step2-after-time-select"
      - tapOn: "続ける"
      - waitForAnimationToEnd:
          timeout: 5000

# Step 3: 情報入力 — customer info (conditional)
- takeScreenshot: "step3-before-fix"
- runFlow:
    when:
      visible: ".*お客様情報を入力してください.*|.*この予約はどなたの予約ですか.*|フリガナ"
    commands:
      - tapOn:
          point: "50%,77%"
      - waitForAnimationToEnd:
          timeout: 1000
      # Furigana is optional; clear stale invalid cached text instead of relying
      # on Japanese clipboard/IME delivery inside LINE WebView.
      - eraseText
      - waitForAnimationToEnd:
          timeout: 1000
      - takeScreenshot: "step3-after-furigana"
      - scrollUntilVisible:
          element:
            text: "続ける"
          direction: "DOWN"
      - tapOn: "続ける"
      - waitForAnimationToEnd:
          timeout: 5000

# Step 4: 予約確認 — final booking confirmation
- takeScreenshot: "step4-confirm"
- runFlow:
    when:
      visible: ".*予約内容.*確認.*|.*この内容で予約する.*"
    commands:
      - scrollUntilVisible:
          element:
            text: "この内容で予約する"
          direction: "DOWN"
      # WebView button hit-testing is inconsistent; calibrated against the
      # fixed footer button, where 95% y triggers the submit action.
      - tapOn:
          point: "50%,95%"
      - waitForAnimationToEnd:
          timeout: 10000
