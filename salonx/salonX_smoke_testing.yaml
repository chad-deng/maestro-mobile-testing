appId: com.storehub.salonx.staff.dev
---
- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    permissions:
      all: "allow"

- extendedWaitUntil:
    visible: 'Extensions|EAS Update|Branch: development|Open Latest|Install Now|Enter your email|.*@.*|Sign In|サインイン|Switch Store|Select Store|.*店舗.*|.*事業.*切.*|.*事业.*切.*|Profile|プロフィール|個人|Dashboard|ダッシュボード'
    timeout: 30000

- runFlow: subflow/open-development-update.yaml
- runFlow:
    when:
      visible: "Open Latest"
    commands:
      - tapOn: "Open Latest"
      - extendedWaitUntil:
          visible: 'Enter your email|.*@.*|Sign In|サインイン|Switch Store|Select Store|.*店舗.*|.*事業.*切.*|.*事业.*切.*|Profile|プロフィール|個人|Dashboard|ダッシュボード'
          timeout: 20000
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "Install Now"
    commands:
      - tapOn: "Install Now"
- runFlow:
    when:
      visible: 'Enter your email|.*@.*|Sign In|サインイン'
    commands:
      - tapOn: ".*@.*|Enter your email|.*メール.*"
      - eraseText
      - inputText: "chad.deng+123@storehub.com"
      - assertVisible: 'chad.deng\+123@storehub\.com'
      - tapOn: "•+|Enter your password|.*password.*|.*パスワード.*"
      - eraseText
      - inputText: 12345678
      - tapOn:
          text: "Sign In|サインイン"
          index: 1
- extendedWaitUntil:
    visible: "Switch Store|Select Store|.*店舗.*|.*事業.*切.*|.*事业.*切.*|Profile|プロフィール|個人|Dashboard|ダッシュボード"
    timeout: 15000
- runFlow:
    when:
      visible: "Switch Store|Select Store|.*店舗.*|.*事業.*切.*|.*事业.*切.*"
    commands:
      - tapOn: "auto_test"
      - tapOn: "Confirm|確認|确认|確定|确定"
- extendedWaitUntil:
    visible: "Profile|プロフィール|個人|Dashboard|ダッシュボード"
    timeout: 15000
- assertVisible: "Profile|プロフィール|個人|Dashboard|ダッシュボード"
- tapOn:
    point: "88%,95%"
- extendedWaitUntil:
    visible: "Language Settings|言語設定"
    timeout: 10000
- tapOn: "Language Settings|言語設定"
- assertVisible: "日本語"
- tapOn: "日本語"
- waitForAnimationToEnd
- tapOn: "Dashboard|ダッシュボード"
- "scroll"
- scrollUntilVisible:
    element: "こんにちは、auto_test"
    direction: "UP"
- assertVisible: "こんにちは、auto_test"
- tapOn:
    text: "予約|Appointments"
    index: -1
- assertVisible: "予約を検索.*|スタッフ、顧客、メール、または電話番号で検索.*|Search.*"
- runFlow: subflow/add_customer_booking.yaml
- tapOn:
    text: "顧客|Customers|顧客管理"
    index: -1
- assertNotVisible: "顧客が見つかりません|No customers found"
- tapOn:
    text: "プロフィール|個人|Profile"
    index: -1
- assertVisible: "取得したバッジ.*"
- tapOn: "ログアウト"
- killApp: com.storehub.salonx.staff.dev
