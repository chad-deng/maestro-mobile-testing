appId: com.storehub.salonx.staff.dev
tags:
  - team
  - skill-categories
  - navigation
  - P1
---
# TEAM-005: Navigate to Skill Categories and Verify Screen
# Description: Login as Manager, navigate to Profile > Team > Skill Categories
# Expected: Skill Categories screen loads with skill-related content visible
# Role: Manager (chad.deng+111@storehub.com)
# Navigation path: Profile tab → Team section → Skill Categories

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle Expo Dev Launcher / EAS Update screens
- runFlow: subflow/open-development-update.yaml

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

- waitForAnimationToEnd

# Reset to login if a previous test left the app signed in
- runFlow:
    when:
      visible: "Profile|プロフィール|個人"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd
      - tapOn: "Sign Out|ログアウト"

- runFlow:
    when:
      visible: "Confirm|確認|确认|確定|确定"
    commands:
      - tapOn: "Confirm|確認|确认|確定|确定"

- runFlow:
    when:
      visible: "Yes|はい"
    commands:
      - tapOn: "Yes|はい"

- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

- waitForAnimationToEnd

# Handle "Open Latest" OTA screen
- runFlow:
    when:
      visible: "Open Latest"
    commands:
      - tapOn: "Open Latest"
      - extendedWaitUntil:
          visible: 'Enter your email|.*@.*|Sign In|サインイン|Switch Store|Select Store|.*店舗.*|.*事業.*切.*|.*事业.*切.*|Profile|プロフィール|個人|Dashboard|ダッシュボード'
          timeout: 20000
      - waitForAnimationToEnd

- waitForAnimationToEnd

# Login as Manager
- tapOn: ".*@.*|Enter your email|.*メール.*"
- eraseText
- tapOn: ".*@.*|Enter your email|.*メール.*"
- eraseText
- inputText: "chad.deng+111@storehub.com"
- assertVisible: 'chad.deng\+111@storehub\.com'

- tapOn: "•+|Enter your password|.*password.*|.*パスワード.*"
- eraseText
- tapOn: "•+|Enter your password|.*password.*|.*パスワード.*"
- eraseText
- inputText: 12345678

- tapOn:
    text: "Sign In|サインイン"
    index: 1

- waitForAnimationToEnd

# Handle store selection if it appears
- runFlow:
    when:
      visible: "auto_test"
    commands:
      - tapOn:
          text: "auto_test"
          index: 0
      - tapOn: "Confirm|確認|确认|確定|确定"
      - waitForAnimationToEnd

# Verify successful login
- assertVisible: "Profile|プロフィール|個人"

# Navigate to Profile tab
- tapOn: "Profile|プロフィール|個人"
- waitForAnimationToEnd

# Verify Team section is visible
- assertVisible: "Team|チーム"

# Tap on Skill Categories under Team section
- tapOn: "Skill Categories"
- waitForAnimationToEnd

# Take screenshot of Skill Categories screen
- takeScreenshot: skill-categories-screen-loaded.png

# Verify Skill Categories screen loaded - check for common skill-related content
- runFlow:
    when:
      visible: ".*[Ss]kill.*|.*スキル.*|.*[Cc]ategory.*|.*カテゴリ.*"
    commands:
      - assertVisible: ".*[Ss]kill.*|.*スキル.*|.*[Cc]ategory.*|.*カテゴリ.*"

# Verify the screen is not empty
- assertNotVisible: "No data found|データがありません|Empty"

# Take final screenshot for verification
- takeScreenshot: skill-categories-verified.png
