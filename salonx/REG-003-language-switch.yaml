appId: com.storehub.salonx.staff.dev
tags:
  - registration
  - language
  - settings
  - P1
---
# REG-003: Language Switch
# Description: Navigate to Profile > Language Settings and change language (e.g., English to Japanese)
# Expected: UI text (menus, buttons) instantly updates to the selected language

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

# Wait for app to load
- waitForAnimationToEnd

# Check if already logged in, if not, perform login
- runFlow:
    when:
      visible: "Enter your email"
    commands:
      # Login flow
      - tapOn: "Enter your email"
      - eraseText
      - tapOn: "Enter your email"
      - eraseText
      - inputText: "chad.deng+123@storehub.com"
      - tapOn: "Enter your password"
      - eraseText
      - inputText: 12345678
      - tapOn:
          text: "Sign In"
          index: 1
      - waitForAnimationToEnd
      # Handle store selection if it appears
      - runFlow:
          when:
            visible: "auto_test"
          commands:
            - tapOn:
                text: "auto_test"
                index: 0
            - tapOn: "Confirm"

# Navigate to Profile tab (English/Japanese)
- runFlow:
    when:
      visible: "Profile|プロフィール|個人"
    commands:
      - tapOn:
          point: "88%,95%"

# Verify we're on Profile screen and find Language Settings (English or Japanese)
- runFlow:
    when:
      visible: "Language Settings"
    commands:
      # Test 1: Switch from English to Japanese
      - tapOn: "Language Settings"
      - assertVisible: "English"
      - assertVisible: "日本語"
      # Select Japanese
      - tapOn: "日本語"

- runFlow:
    when:
      visible: "言語設定"
    commands:
      # Already in Japanese, switch to English first
      - tapOn: "言語設定, 日本語"
      - assertVisible: "English"
      - assertVisible: "日本語"
      # Select English
      - tapOn: "English"
      - tapOn:
          point: "50%,24%"
      # Navigate back to Profile
      - tapOn: "Profile"
      # Now test switching to Japanese
      - tapOn: "Language Settings"
      - tapOn: "日本語"

# Verify UI updates to Japanese immediately
- tapOn:
    point: "50%,24%"
- waitForAnimationToEnd
    
# Verify main navigation is now in Japanese
- assertVisible:
    text: "ホーム|ダッシュボード"
- assertVisible: "予約"
- assertVisible:
    text: "顧客|顧客管理"
- assertVisible:
    text: "個人|プロフィール"

# Navigate back to Profile/Settings
- tapOn: "個人|プロフィール"

# Verify Language Settings is now in Japanese
- assertVisible: "言語設定"

# Test 2: Switch back from Japanese to English
- tapOn: "言語設定, 日本語"
- assertVisible: "English"
- assertVisible: "日本語"

# Select English
- tapOn: "English"

# Verify UI updates back to English immediately
- tapOn:
    point: "50%,24%"
- waitForAnimationToEnd

# Verify main navigation is now in English
- assertVisible:
    text: "Home|Dashboard"
- assertVisible: "Appointments"
- assertVisible: "Customers"
- assertVisible: "Profile"

# Navigate back to Profile
- tapOn: "Profile"

# Verify Language Settings is back in English
- assertVisible: "Language Settings"

