appId: com.storehub.salonx.staff.dev
tags:
  - bug
  - localization
  - booking
  - P2
  - regression
---
# BUG-002: Calendar date headers displayed in English when language is Japanese
# Bug ID: recvmhqRel
# Platform: iOS
#
# Description: Date headers show "Friday, December 26" instead of Japanese format
#
# Steps to Reproduce:
# 1. Set the language to Japanese
# 2. Navigate to the Booking (予約) tab in the Staff App
# 3. Scroll through the appointment list to view upcoming days
# 4. Observe the language used for date headers
#
# Expected: Date headers in Japanese format
# Actual (Bug): Date headers in English

- launchApp:
    appId: "com.storehub.salonx.staff"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

- waitForAnimationToEnd:
    timeout: 8000

# Dismiss Google Password Manager popup with coordinate tap at "No thanks" button
# The button is at bottom-left of the popup
- tapOn:
    point: "8%,96%"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "8%,96%"
    optional: true
- waitForAnimationToEnd:
    timeout: 1000

# Check if already logged in (skip login if so)
- runFlow:
    when:
      visible: "Enter your email"
    commands:
      # Perform login
      - tapOn: "Enter your email"
      - eraseText
      - tapOn: "Enter your email"
      - eraseText
      - inputText: "chad.deng+123@storehub.com"
      - tapOn: "Enter your password"
      - eraseText
      - inputText: "12345678"
      - tapOn:
          text: "Sign In"
          index: 1
      - waitForAnimationToEnd:
          timeout: 10000
      # Handle store selection
      - runFlow:
          when:
            visible: "auto_test"
          commands:
            - tapOn:
                text: "auto_test"
                index: 0
            - tapOn: "Confirm"

- waitForAnimationToEnd

# Navigate to Booking/Appointments tab
- tapOn:
    text: "Appointments"

- waitForAnimationToEnd

# Scroll to see more dates
- scroll

- waitForAnimationToEnd

# Verify NO English day names appear (bug verification)
- assertNotVisible:
    text: "Monday"
- assertNotVisible:
    text: "Tuesday"
- assertNotVisible:
    text: "Wednesday"
- assertNotVisible:
    text: "Thursday"
- assertNotVisible:
    text: "Friday"
- assertNotVisible:
    text: "Saturday"
- assertNotVisible:
    text: "Sunday"

# Verify we're on the Appointments screen
- assertVisible:
    text: "Today|今日|Appointments"
