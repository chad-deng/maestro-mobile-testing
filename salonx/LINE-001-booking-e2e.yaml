appId: jp.naver.line.android
tags:
  - line
  - booking
  - e2e
  - P0
---
# Launch LINE and open LIFF app via deep link
- runFlow: subflow/line-open-liff.yaml

# Complete booking steps (Steps 0-4)
- runFlow: subflow/line-booking-steps.yaml

# Wait for booking result — success screen or post-booking detail page
- extendedWaitUntil:
    visible: ".*[Ss]uccess.*|.*完了.*|.*[Cc]onfirmed.*|.*予約完了.*|.*予約詳細.*|.*[Tt]hank.*|.*ありがとうございます.*|.*予約が確定.*"
    timeout: 60000

# Capture evidence
- takeScreenshot: "LINE-booking-success"

# Final assertion — at least one completed-booking indicator must be visible
- assertVisible: ".*[Ss]uccess.*|.*完了.*|.*[Cc]onfirmed.*|.*予約完了.*|.*予約詳細.*|.*[Tt]hank.*|.*ありがとうございます.*|.*予約が確定.*"
