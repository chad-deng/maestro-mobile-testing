appId: com.storehub.salonx.staff.dev
tags:
  - role-permission
  - manager
  - customer-info
  - P0
---
# ROLE-001: Manager Can View Complete Customer Info
# Description: Login as Manager and verify complete customer info is visible
# Expected: Manager can see basic info (address, phone number) on customer details
# Role: Manager (chad.deng+111@storehub.com)

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

# Wait for app to load
- waitForAnimationToEnd

# Reset to login if a previous test left the app signed in
- runFlow:
    when:
      visible: "Profile|プロフィール|個人"
    commands:
      - tapOn:
          point: "88%,95%"
      - waitForAnimationToEnd
      - tapOn: "Sign Out|ログアウト"

- runFlow:
    when:
      visible: "Confirm|確認"
    commands:
      - tapOn: "Confirm|確認"

- runFlow:
    when:
      visible: "Yes|はい"
    commands:
      - tapOn: "Yes|はい"

- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

- waitForAnimationToEnd

# Login as Manager
- tapOn: ".*@.*|Enter your email|.*メール.*"
- eraseText
- tapOn: ".*@.*|Enter your email|.*メール.*"
- eraseText
- inputText: "chad.deng+111@storehub.com"
- assertVisible: 'chad.deng\+111@storehub\.com'

- tapOn: "•+|Enter your password|.*password.*|.*パスワード.*"
- eraseText
- tapOn: "•+|Enter your password|.*password.*|.*パスワード.*"
- eraseText
- inputText: 12345678

- tapOn:
    text: "Sign In|サインイン"
    index: 1

- waitForAnimationToEnd

# Handle store selection if it appears
- runFlow:
    when:
      visible: "auto_test"
    commands:
      - tapOn:
          text: "auto_test"
          index: 0
      - tapOn: "Confirm|確認"
      - waitForAnimationToEnd

# Verify successful login
- assertVisible: "Profile|プロフィール|個人"

# Navigate to Customer tab
- tapOn: "Customer|Customers|顧客|顧客管理"

- waitForAnimationToEnd

# Take screenshot of customer list
- takeScreenshot: manager-customer-list.png

# Tap on first customer to view details
- runFlow:
    when:
      visible: ".*@.*"
    commands:
      - tapOn:
          text: ".*@.*"
          index: 0

- runFlow:
    when:
      visible: "Test.*"
    commands:
      - tapOn:
          text: "Test.*"
          index: 0

- waitForAnimationToEnd

# Take screenshot of customer details
- takeScreenshot: manager-customer-details.png

# Verify Manager can see complete customer info (basic info visible)
# Check for address field
- runFlow:
    when:
      visible: ".*[Aa]ddress.*"
    commands:
      - assertVisible:
          text: ".*[Aa]ddress.*"

# Check for phone number field
- runFlow:
    when:
      visible: ".*[Pp]hone.*"
    commands:
      - assertVisible:
          text: ".*[Pp]hone.*"

# Take final screenshot for verification
- takeScreenshot: manager-complete-info-visible.png
