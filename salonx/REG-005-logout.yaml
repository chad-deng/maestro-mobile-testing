appId: com.storehub.salonx.staff.dev
tags:
  - registration
  - logout
  - security
  - P0
---
# REG-005: Logout
# Description: Click the "Sign Out" / "ログアウト" button in the Profile tab
# Expected: User session ends and the app returns to the "Sign In" screen

- launchApp:
    appId: "com.storehub.salonx.staff.dev"
    stopApp: true
    clearState: false
    permissions:
      all: "allow"

# Handle optional "Install Now" prompt
- runFlow:
    when:
      visible: 'Install Now'
    commands:
        - tapOn: "Install Now"

# Wait for app to load
- waitForAnimationToEnd

# Check if already logged in, if not, perform login
- runFlow:
    when:
      visible: "Enter your email"
    commands:
      # Login flow
      - tapOn: "Enter your email"
      - eraseText
      - tapOn: "Enter your email"
      - eraseText
      - inputText: "chad.deng+123@storehub.com"
      - tapOn: "Enter your password"
      - eraseText
      - inputText: 12345678
      - tapOn:
          text: "Sign In"
          index: 1
      - waitForAnimationToEnd
      # Handle store selection if it appears
      - runFlow:
          when:
            visible: "Salon.*"
          commands:
            - tapOn:
                text: "Salon.*"
                index: 0
            - tapOn: "Confirm"

# Verify we're logged in (either already or after login)
- runFlow:
    when:
      visible: "Profile"
    commands:
      - assertVisible: "Profile"

- runFlow:
    when:
      visible: "個人"
    commands:
      - assertVisible: "個人"

# Test 1: Logout in English
- tapOn:
    point: "88%,95%"

# Look for Sign Out button (English)
- runFlow:
    when:
      visible: "Sign Out"
    commands:
      - assertVisible: "Sign Out"
      - tapOn: "Sign Out"

# Look for ログアウト button (Japanese)
- runFlow:
    when:
      visible: "ログアウト"
    commands:
      - assertVisible: "ログアウト"
      - tapOn: "ログアウト"

# Handle confirmation dialog if present
- runFlow:
    when:
      visible: "Confirm"
    commands:
      - tapOn: "Confirm"

- runFlow:
    when:
      visible: "Yes"
    commands:
      - tapOn: "Yes"

- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

# Verify we're back on the Sign In screen
- assertVisible: "Enter your email"
- assertVisible: "Enter your password"

# Verify user cannot access protected screens without logging in again
- assertNotVisible: "Profile"
- assertNotVisible: "個人"

# Test 2: Verify we can log in again after logout
- tapOn: "Enter your email"
- eraseText
- inputText: "chad.deng+123@storehub.com"
- tapOn: "Enter your password"
- eraseText
- inputText: 12345678
- tapOn:
    text: "Sign In"
    index: 1

# Handle store selection if it appears
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Salon.*"
    commands:
      - tapOn:
          text: "Salon.*"
          index: 0
      - tapOn: "Confirm"

# Verify successful re-login
- assertVisible: "Profile"

